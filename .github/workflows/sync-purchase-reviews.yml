name: Sync purchase reviews

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-purchase-reviews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import new reviews and rebuild static pages
        run: node scripts/sync-reviews.mjs
      - name: Verify SEO and protected footer
        run: |
          node scripts/check-footers.mjs
          node scripts/audit-seo.mjs
      - name: Publish new reviews
        run: |
          if git diff --quiet; then
            echo "No new reviews"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews story sitemap.xml feed.xml llms.txt robots.txt
          git commit -m "content: sync Naver Cafe purchase reviews"
          git push
