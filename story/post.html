  <script>
  (function(){
    var main=document.getElementById('main');
    function el(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
    function fmtDate(s){var d=new Date(s+'T00:00:00');if(isNaN(d))return s||'';return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.';}
    function appendInline(node,text){var pattern=/\[([^\]]+)\]\(([^)]+)\)/g;var last=0,match;while((match=pattern.exec(text))){node.appendChild(document.createTextNode(text.slice(last,match.index)));var href=match[2].trim();if(/^(https?:\/\/|\.\.?\/|#)/.test(href)){var a=el('a',null,match[1]);a.href=href;if(/^https?:\/\//.test(href)){a.target='_blank';a.rel='noopener';}node.appendChild(a);}else{node.appendChild(document.createTextNode(match[0]));}last=pattern.lastIndex;}node.appendChild(document.createTextNode(text.slice(last)));}
    function renderBody(src){var box=el('div','post-body');String(src||'').replace(/\r\n/g,'\n').split(/\n\s*\n/).forEach(function(block){block=block.trim();if(!block)return;var lines=block.split('\n');if(lines.every(function(l){return /^- /.test(l.trim());})){var ul=el('ul');lines.forEach(function(l){var li=el('li');appendInline(li,l.trim().slice(2));ul.appendChild(li);});box.appendChild(ul);}else if(/^## /.test(block)){box.appendChild(el('h2',null,block.slice(3).trim()));}else{var p=el('p');appendInline(p,block);box.appendChild(p);}});return box;}
    function notFound(){var d=el('div','notfound');d.append(el('h1',null,'글을 찾을 수 없습니다'),el('p',null,'주소가 잘못되었거나 삭제된 글일 수 있습니다.'));var a=el('a',null,'이야기 목록으로');a.href='./';d.appendChild(a);main.appendChild(d);}
    function hrefOf(p){return p.url?String(p.url):'post.html?id='+encodeURIComponent(p.id||'');}
    function setAttr(sel,attr,val){var n=document.querySelector(sel);if(n)n.setAttribute(attr,val);}
    function addLd(obj){var ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify(obj);document.head.appendChild(ld);}
    function setMeta(post){var title=String(post.title||'이야기');var desc=String(post.description||post.summary||'').slice(0,160);var url=location.origin+location.pathname+'?id='+encodeURIComponent(post.id||'');var author=String(post.author||'').trim();document.title=title+' | 노리박스';setAttr('meta[name="description"]','content',desc);setAttr('meta[name="author"]','content',author);setAttr('link[rel="canonical"]','href',url);setAttr('meta[property="og:title"]','content',title);setAttr('meta[property="og:description"]','content',desc);setAttr('meta[property="og:url"]','content',url);var article={'@context':'https://schema.org','@type':'BlogPosting',headline:title,description:desc,datePublished:String(post.date||''),dateModified:String(post.updated||post.date||''),mainEntityOfPage:url,keywords:Array.isArray(post.tags)?post.tags.map(String).join(', '):''};if(author)article.author={'@type':'Person',name:author};addLd(article);}
    function renderFaq(faq){var sec=el('section','faq');sec.appendChild(el('h2',null,'자주 묻는 질문'));faq.forEach(function(f){var d=el('details');d.append(el('summary',null,String(f.q)),el('p',null,String(f.a)));sec.appendChild(d);});return sec;}
    function render(posts){var id=new URLSearchParams(location.search).get('id')||new URLSearchParams(location.search).get('slug');posts=(Array.isArray(posts)?posts:[]).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});var idx=posts.findIndex(function(p){return String(p.id)===id||(p.url&&String(p.url).replace(/\.html$/,'')===id);});if(idx<0){notFound();return;}var post=posts[idx];setMeta(post);var art=el('article','post-article reveal');var head=el('header','post-head');var time=el('time',null,fmtDate(post.date));time.setAttribute('datetime',String(post.date||''));head.append(time,el('h1',null,String(post.title||'(제목 없음)')));if(post.author)head.appendChild(el('p','post-author','글 · '+String(post.author)));if(Array.isArray(post.tags)&&post.tags.length){var tags=el('div','post-tags');post.tags.forEach(function(tag){tags.appendChild(el('span','post-tag',String(tag)));});head.appendChild(tags);}art.append(head,renderBody(post.body));var faq=Array.isArray(post.faq)?post.faq.filter(function(f){return f&&f.q&&f.a;}):[];if(faq.length)art.appendChild(renderFaq(faq));var prev=posts[idx+1],next=posts[idx-1];if(prev||next){var nav=el('nav','post-navigation');function cell(p,cls,label){if(!p){nav.appendChild(el('span'));return;}var a=el('a',cls);a.href=hrefOf(p);a.append(el('span','post-nav-dir',label),el('strong',null,String(p.title||'')));nav.appendChild(a);}cell(prev,'prev','이전 글');cell(next,'next','다음 글');art.appendChild(nav);}main.appendChild(art);art.classList.add('is-visible');}
    fetch('posts.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(render).catch(notFound);
  })();
  </script>
